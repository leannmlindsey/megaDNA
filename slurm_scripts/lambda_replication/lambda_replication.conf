# megaDNA LAMBDA_v1 replication config.
#
# Sourced by:
#   slurm_scripts/lambda_replication/run_lambda_training.sh
#   slurm_scripts/lambda_replication/run_lambda_inference.sh
#   slurm_scripts/lambda_replication/check_training.sh
#   slurm_scripts/lambda_replication/check_inference.sh
#
# Workflow:
#   1. bash slurm_scripts/lambda_replication/run_lambda_training.sh
#   2. wait for jobs to finish (squeue -u $USER); bash .../check_training.sh
#   3. bash slurm_scripts/lambda_replication/run_lambda_inference.sh
#   4. wait; bash .../check_inference.sh
#
# megaDNA is a GENERATIVE byte-level model and does NOT finetune. Classification
# = extract embeddings from the frozen pretrained backbone, then train a linear
# probe + a 3-layer NN on top. So the "trainable / per-seed" stage here IS the
# embedding analysis (embedding_analysis_megadna.py), and the winner is the best
# seed's trained 3-layer NN. The pipeline loops over SEGMENT_LENGTHS; for each it
# runs the embedding analysis x N seeds (the training stage), then picks the
# best-of-N seed by TEST-set MCC -> winners.json, then runs inference on the
# matching-length diagnostics (test/fpr/fnr/gc_control) and genome-wide CSVs
# using the winning seed's classifier + scaler. Outputs are per-length.

# --- REQUIRED -----------------------------------------------------------------

# LAMBDA_v1 dataset root. Expected structure (LAMBDA_v1 layout):
#   $LAMBDA_BASE/train_val_test/<LEN>/{train,val,test}.csv     mixed phage+bacteria
#   $LAMBDA_BASE/fpr_test/<LEN>/bacteria_segments_<LEN>.csv    bacteria-only (FPR control)
#   $LAMBDA_BASE/shuffled_controls/<LEN>/test_shuffled.csv     GC-preserving shuffled control
export LAMBDA_BASE="/work/hdd/bfzj/llindsey1/LAMBDA_REPLICATION/LAMBDA_v1"

# Replication output root. Per-length results land under here:
#   $OUTPUT_DIR/<LEN>/finetune/<variant>/seed-<N>/   embedding_analysis_results.json
#                                                    + three_layer_nn_pretrained.pt
#                                                    + three_layer_nn_pretrained_scaler.pkl
#   $OUTPUT_DIR/<LEN>/winners.json                   picked by run_lambda_inference.sh
#   $OUTPUT_DIR/<LEN>/inference/<variant>/           <dataset>_predictions.csv + _metrics.json
#   $OUTPUT_DIR/logs/                                SLURM stdout/stderr (shared)
#
# Delta-AI: keep outputs on the project work filesystem (off the home quota).
export OUTPUT_DIR="/work/hdd/bfzj/llindsey1/LAMBDA_REPLICATION/megaDNA/outputs"

# Sequence lengths to run. megaDNA's native context is ~96kb (byte-level), so all
# LAMBDA windows fit comfortably. Set to a subset (e.g. "2k 4k") to run fewer.
export SEGMENT_LENGTHS="2k 4k 8k"

# --- OPTIONAL: diagnostics NOT in the train_val_test split -------------------

# FNR (false negative rate) test sets — phage-only sequences. Per-length CSV.
# Variable name is FNR_<LEN> where <LEN> matches an entry in SEGMENT_LENGTHS.
# Leave empty/unset to skip the FNR diagnostic for that length.
# NOTE: 2k uses the sliding-window segment set (phage_segments_2k_1k.csv),
# consistent with the 4k/8k sliding-window files. The phrog-annotated subset
# (phage_annotated_segments_2k.csv) is the WRONG file FOR FNR — but it IS the
# correct input for the separate PHROG diagnostic (see PHROG_2k below).
export FNR_2k="${LAMBDA_BASE}/fnr_test/2k/phage_segments_2k_1k.csv"
export FNR_4k="${LAMBDA_BASE}/fnr_test/4k/phage_segments_4k_2k.csv"
export FNR_8k="${LAMBDA_BASE}/fnr_test/8k/phage_segments_8k_4k.csv"          # VERIFIED: 8k exists

# PHROG diagnostic — the phrog-annotated phage set (2k only). This is SEPARATE
# from the FNR diagnostic above: FNR uses the sliding-window phage_segments_*
# files; PHROG uses the annotated subset. The central PHROG table groups by the
# phrog_db_category column, which inference_megadna.py passes through unchanged
# (it copies all input columns). Per-length var PHROG_<LEN>; only 2k is defined.
# The output is written with the model-prefixed CANONICAL name
# megaDNA_phage_annotated_segments_2k_predictions.csv (see run_lambda_inference.sh).
export PHROG_2k="${LAMBDA_BASE}/fnr_test/2k/phage_annotated_segments_2k.csv"

# Genome-wide inputs — per-length DIRECTORY of *.csv segment files (one inference
# job per CSV per variant). Leave empty/unset to skip genome-wide. Missing dirs
# are warned-and-skipped. NOTE: clustering / genome-level aggregation is done
# CENTRALLY by the harvest pipeline — this repo does NOT run a local
# genome-analysis job (genome_predictions_megadna.py is intentionally NOT used).
export GENOME_WIDE_2k="${LAMBDA_BASE}/genome_wide/2k"
export GENOME_WIDE_4k="${LAMBDA_BASE}/genome_wide/4k"
export GENOME_WIDE_8k="${LAMBDA_BASE}/genome_wide/8k"

# FPR (bacteria-only) and GC control (shuffled) are AUTO-DERIVED by the inference
# driver from LAMBDA_BASE — they are NOT set here:
#   ${LAMBDA_BASE}/fpr_test/<LEN>/bacteria_segments_<LEN>.csv      (FPR control)
#   ${LAMBDA_BASE}/shuffled_controls/<LEN>/test_shuffled.csv       (GC control)

# --- OPTIONAL: model + analysis hyperparameters ------------------------------

# megaDNA has a single architecture/variant here. Keeping the variant loop
# mirrors the ProkBERT/DNABERT-2/NT-v2 layout (outputs/<len>/finetune/<variant>/).
export VARIANTS="megadna"

# Pretrained megaDNA backbone checkpoint (.pt), the 145M phage model. CONFIRM
# this path on Delta — the .pt must be transferred here (it is not on HF as a
# .pt). Override if your copy lives elsewhere.
export MODEL_PATH="/work/hdd/bfzj/llindsey1/LAMBDA_REPLICATION/MODELS/megaDNA/megaDNA_phage_145M.pt"

# Random seeds for the per-seed embedding analysis (one job per variant per seed).
# The standalone megaDNA multiseed wrapper used 1..10; 1-5 matches the other
# LAMBDA model repos (ProkBERT/DNABERT-2/NT-v2) for comparability. Adjustable.
export SEEDS="1 2 3 4 5"

# Which embedding layer of the hierarchical backbone to probe:
#   local=196d, middle=256d, global=512d, all=concatenated.
# "middle" is the convention used by the existing megaDNA multiseed wrapper.
export LAYER="middle"

# Pooling over the (flattened) sequence dimension: mean | max | cls.
export POOLING="mean"

# 3-layer NN (and linear-probe) hyperparameters (from run_embedding_analysis.sh).
export NN_EPOCHS="100"
export NN_HIDDEN_DIM="256"
export NN_LR="0.001"

# Include a random-init backbone baseline alongside pretrained ("true"|"false").
# Off by default for the replication sweep (doubles embedding extraction time);
# turn on if you want the embedding-power delta recorded in the results JSON.
export INCLUDE_RANDOM_BASELINE="true"

# Per-window MAX_LENGTH (base pairs). megaDNA is byte-level with a ~96kb native
# context, so the standalone scripts default to 96000. The LAMBDA windows are
# exactly 2k/4k/8k bp, so we cap MAX_LENGTH just above each window (window + a
# little headroom for the start/end sentinel tokens) — this is a pure truncation
# cap (sequences shorter than the cap are unaffected) and avoids reserving the
# full 96kb budget. To exactly match the standalone scripts, set all three to
# 96000; results are identical because no LAMBDA window exceeds these caps.
export MAX_LENGTH_2k="2200"
export MAX_LENGTH_4k="4200"
export MAX_LENGTH_8k="8200"

# --- OPTIONAL: inference -----------------------------------------------------

export INF_THRESHOLD="0.5"

# Embedding-extraction batch size (training + inference). megaDNA is memory-heavy
# at long context; keep small.
export BATCH_SIZE="8"

# --- OPTIONAL: SLURM resources -----------------------------------------------

# Delta-AI (NCSA GH200) scheduler settings. The ghx4 partition is 1x GH200 per
# GPU; request a single GPU. Override SLURM_GPUS if you change partitions.
export SLURM_ACCOUNT="bfzj-dtai-gh"
export SLURM_PARTITION="ghx4"
export SLURM_GPUS="--gpus-per-node=1"

export FT_MEM="64g"
export FT_TIME="8:00:00"
export INF_MEM="32g"
export INF_TIME="2:00:00"

# Conda base to source on the compute node (Delta-AI). The job scripts source
# "${CONDA_BASE}/etc/profile.d/conda.sh" before `conda activate ${CONDA_ENV}`.
export CONDA_BASE="/u/llindsey1/miniconda3"

# Conda environment that has torch + the megaDNA package.
export CONDA_ENV="megadna"
